on:
    push:
        paths:
            - 'wnba/draft/json/**'
    workflow_dispatch:

name: wehoop WNBA Draft trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    wehoop_wnba_draft_trigger:
        runs-on: ubuntu-latest
        # `on: push` has no branch filter here, and the dispatch payload is hardcoded to
        # refs/heads/main, so a feature-branch or tag push started a production build of
        # work that had not landed (cfbfastR-cfb-raw#10). Same guard as that repo.
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Trigger wehoop WNBA Draft pipeline
              uses: peter-evans/repository-dispatch@v4
              with:
                  token: ${{ secrets.SDV_GH_TOKEN }}
                  repository: sportsdataverse/wehoop-wnba-data
                  event-type: annual_wnba_draft
                  client-payload: |-
                    {
                      "ref": "refs/heads/main",
                      "event_name": "annual_wnba_draft",
                      "commit_message": ${{ toJSON(github.event.head_commit.message) }}
                    }
