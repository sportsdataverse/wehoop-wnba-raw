name: tests

# Without this, the offline suite only ran inside the nightly scrape, so it
# gated nothing: a broken import or a reintroduced type=bool would ship and be
# discovered at 06:30 UTC by a failing cron. These tests touch no network.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The archive is ~58GB / 533k files; a normal checkout here spent 15
          # minutes cloning it and never reached the tests. Sparse-checkout the
          # code only and skip wnba/ entirely -- which is why the archive-backed
          # tests are marked and deselected below.
          sparse-checkout: |
            python
            tests
            scripts
            pyproject.toml
            uv.lock
          sparse-checkout-cone-mode: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.12'
          cache-dependency-glob: uv.lock

      - name: Install
        # --frozen: a PR must not silently re-resolve. The daily workflow is
        # the only place that runs `uv lock --upgrade`.
        run: uv sync --frozen --dev

      - name: Tests
        # `archive` tests read the committed wnba/ tree, which isn't checked out
        # here. They run in the daily workflow, on the self-hosted runner that
        # already holds the archive.
        run: uv run pytest -q -m "not archive"

      - name: Lint
        run: uv run ruff check python tests
