name: Daily WNBA Raw Scrape

# Umbrella workflow that runs every per-dataset Python scraper in sequence and
# commits the cumulative output in a single push. The single push is intentional
# — wehoop_wnba_data_trigger.yml watches push events on main and fires the
# repository_dispatch to wehoop-wnba-data, so one push per day means one
# downstream dispatch per day.
#
# Cadence is staggered ~2h ahead of wehoop-wnba-data/daily_wnba.yml (which
# fires at 07:00 UTC) so the parser side always sees fresh raw JSON. The
# month/day windows mirror the in-season ranges used by the data repo's
# daily workflow so we don't burn compute scraping during the offseason.
#
# Note: espn_wnba_05_draft_scrape.py is intentionally NOT included here. The
# draft scrape has its own annual workflow that fires
# wehoop_wnba_draft_trigger.yml; rolling it into the daily would re-trigger the
# draft pipeline 365 times a year for no benefit.

# Serialize every workflow in this repo that commits to it. Two runs in flight put
# one of them behind origin and its push is rejected -- and where the git calls
# are swallowed with no rc check, that lands as a GREEN job that published
# nothing. Worked examples: wehoop-wnba-data runs 32192069433 + 32192069566, and
# hoopR-nba-data run 32204419012, all on 2026-08-18/19.
#
# cancel-in-progress is FALSE on purpose -- these runs upload release assets, and
# cancelling mid-upload leaves a tag half-updated. Queue instead.
concurrency:
  group: ${{ github.repository }}-commit
  cancel-in-progress: false

on:
  schedule:
    - cron: '30 6 1-12 5-10 *'    # May - October (regular season + playoffs)
  workflow_dispatch:
    inputs:
      start_year:
        description: 'Start season year (YYYY)'
        required: false
        default: '2026'
      end_year:
        description: 'End season year (YYYY)'
        required: false
        default: '2026'
      rescrape:
        description: 'Force re-scrape of files already on disk'
        required: false
        default: 'false'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  daily_wnba_raw:
    runs-on: [self-hosted, sdv-droplet]
    env:
      START_YEAR: ${{ github.event.inputs.start_year || '2026' }}
      END_YEAR: ${{ github.event.inputs.end_year || '2026' }}
      RESCRAPE: ${{ github.event.inputs.rescrape || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SDV_GH_TOKEN }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.11'

      # uv, not pip. This job runs on a SELF-HOSTED runner with a persistent
      # site-packages, where pip's version-based satisfaction check silently
      # skips upgrades: a bare `>=` floor left it on sportsdataverse 0.0.50 for
      # 25 releases (three weeks of failed scrapes), and even `--upgrade`
      # against the git branch was a no-op because main still reports 0.0.75 --
      # pip cloned, resolved, built, then skipped the install. uv resolves the
      # branch to a COMMIT recorded in uv.lock and syncs an isolated project
      # venv, so neither failure mode is representable.
      - name: Sync the locked project environment
        run: uv sync --upgrade-package sportsdataverse

      # Fail at install time, loudly, instead of three stages into a scrape.
      # The 2026-07-12..08-02 outage was exactly this: stages 01-04 passed and
      # stage 06 died on ImportError, so the run looked half-healthy for three
      # weeks. These are every sportsdataverse symbol the stages import.
      - name: Verify the sportsdataverse surface the stages need
        run: |
          uv run --no-sync python -c "from importlib.metadata import version; print('sportsdataverse', version('sportsdataverse'))"
          uv run --no-sync python - <<'PY'
          from sportsdataverse.dl_utils import download
          from sportsdataverse.scrape.espn.cli import str2bool
          from sportsdataverse.scrape.espn.persist import write_payload
          from sportsdataverse.wnba import espn_wnba_player_core, espn_wnba_player_stats_v3
          from sportsdataverse.wnba.wnba_draft import espn_wnba_draft
          from sportsdataverse.wnba.wnba_game_officials import espn_wnba_game_officials
          from sportsdataverse.wnba.wnba_standings import espn_wnba_standings
          from sportsdataverse.wnba.wnba_team_roster import espn_wnba_team_roster
          from sportsdataverse.wnba.wnba_team_stats import espn_wnba_team_stats
          print("sportsdataverse surface OK")
          PY

      - name: Scrape schedules
        run: uv run --no-sync python python/espn_wnba_01_schedules_scrape.py --start_year "$START_YEAR" --end_year "$END_YEAR" -r "$RESCRAPE"

      - name: Scrape per-game JSON (PBP)
        run: uv run --no-sync python python/espn_wnba_02_pbp_scrape.py --start_year "$START_YEAR" --end_year "$END_YEAR" -r "$RESCRAPE"

      - name: Scrape team rosters
        run: uv run --no-sync python python/espn_wnba_08_team_rosters_scrape.py --start_year "$START_YEAR" --end_year "$END_YEAR" -r "$RESCRAPE"

      - name: Scrape player season stats
        run: uv run --no-sync python python/espn_wnba_06_player_stats_scrape.py --start_year "$START_YEAR" --end_year "$END_YEAR" -r "$RESCRAPE"

      - name: Scrape player core (identity/bio)
        run: uv run --no-sync python python/espn_wnba_09_player_core_scrape.py --start_year "$START_YEAR" --end_year "$END_YEAR" -r "$RESCRAPE"

      - name: Scrape team season stats
        run: uv run --no-sync python python/espn_wnba_07_team_stats_scrape.py --start_year "$START_YEAR" --end_year "$END_YEAR" -r "$RESCRAPE"

      - name: Scrape standings
        run: uv run --no-sync python python/espn_wnba_03_standings_scrape.py --start_year "$START_YEAR" --end_year "$END_YEAR" -r "$RESCRAPE"

      - name: Scrape per-game rosters
        run: uv run --no-sync python python/espn_wnba_04_game_rosters_scrape.py --start_year "$START_YEAR" --end_year "$END_YEAR" -r "$RESCRAPE"

      - name: Scrape per-game officials
        run: uv run --no-sync python python/espn_wnba_10_officials_scrape.py --start_year "$START_YEAR" --end_year "$END_YEAR" -r "$RESCRAPE"

      - name: Commit any new JSON files
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add wnba/
          if [ -n "$(git status --porcelain)" ]; then
            # Commit message format must keep ONLY the start + end years
            # as digits. The downstream `wehoop-wnba-data` daily
            # workflow parses with `grep -oE '[0-9]+'` to extract
            # START_YEAR (head -1) and END_YEAR (tail -1). Extra
            # numbers (date, run id, etc.) get captured as END_YEAR
            # and the parser fails. Match the legacy bot format.
            git commit -m "WNBA Raw Update (Start: ${{ env.START_YEAR }} End: ${{ env.END_YEAR }})"
            git push
          else
            echo "No new files to commit"
          fi
